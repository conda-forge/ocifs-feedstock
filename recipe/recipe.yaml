schema_version: 1

context:
  name: ocifs
  version: "1.3.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ocifs-${{ version }}.tar.gz
  sha256: 52658665366210924eca61716ad3fce3c3cdf772c0e95d47fd378db7f969c6f4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.8
    - pip
  run:
    - python >=${{ python_min }}
    - fsspec >=0.8.7
    - oci >=2.43.1
    - requests

tests:
  - python:
      imports:
        - ocifs
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Convenient filesystem interface over Oracle Cloud's Object Storage
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/oracle/ocifs

extra:
  recipe-maintainers:
    - jan-janssen
